name: seu_timetable
description: SEU综合课表，安卓与iOS共用的离线Flutter课表。
publish_to: none
version: 1.4.0+13

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  uuid: ^4.6.0
  characters: ^1.4.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/school_import.js
    - assets/labor_news.js

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true
