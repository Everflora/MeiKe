name: Build MeiKe PWA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: 'GitHub Pages repository path, including leading/trailing slash'
        default: '/MeiKe-web/'
        required: true
      discussion_api:
        description: 'Optional HTTPS API base URL ending in /; leave empty to disable web discussion'
        default: ''
        required: false
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --platform chrome test/web_storage_test.dart
      - run: node --test tool/pwa/pwa_test.mjs
      - name: Build offline release
        env:
          MEIKE_BASE_PATH: ${{ inputs.base_path || '/MeiKe-web/' }}
          MEIKE_DISCUSSION_API: ${{ inputs.discussion_api || '' }}
        run: bash tool/pwa/build.sh "$MEIKE_BASE_PATH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: meike-pages-repository
          path: build/pages-repository/
          include-hidden-files: true
          retention-days: 7
